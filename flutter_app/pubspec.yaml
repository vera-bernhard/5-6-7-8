name: audio_timestamp_trainer_flutter
description: A Flutter port of the Audio Timestamp Trainer App (functional equivalent)
publish_to: 'none'
environment:
  sdk: '>=2.18.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  just_audio: ^0.10.5
  file_picker: ^10.3.10
  path_provider: ^2.0.15
  audio_waveforms: ^2.0.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/